[project]
name = "radiacao-solar"
version = "0.1.0"
description = "Ferramenta local para extrair, combinar e exportar dados de radiação solar (UNESP)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Projeto IC - UNESP" }]
dependencies = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "plotly>=5.18",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "sources", "output", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
