name: Empacotar PIRAXIS (Windows portátil)

# Gera o PACOTE PORTÁTIL de Windows (Python embutido) numa máquina Windows da
# própria GitHub. Ninguém precisa instalar Python — nem para gerar, nem para
# rodar. O resultado fica guardado em DOIS lugares:
#
#   1. RELEASE "pacote-windows" (PERMANENTE, link fixo, NÃO expira)  <-- use este
#      Página: .../releases/tag/pacote-windows
#      Download direto: .../releases/download/pacote-windows/PIRAXIS-windows-x64.zip
#      É a "cópia para sempre": cada execução do workflow ATUALIZA esta Release.
#
#   2. ARTEFATO "PIRAXIS-windows-x64" (temporário, expira em 90 dias)
#      Anexado à execução, útil como cópia da build específica.
#
# Como ATUALIZAR (para um novo teste no laboratório), pelo navegador:
#   1. Aba "Actions" -> "Empacotar PIRAXIS (Windows portátil)".
#   2. "Run workflow" -> confirmar. Em uns minutos a Release "pacote-windows"
#      já aponta para a versão nova (mesmo link de sempre).
#
# Como USAR na máquina de destino (sem Python):
#   Baixe PIRAXIS-windows-x64.zip, extraia em um caminho CURTO (ex.: C:\PIRAXIS)
#   e dê dois cliques em INICIAR PIRAXIS.bat. O caminho curto evita o limite de
#   260 caracteres do Windows (que faz o descompactador pular arquivos).

on:
  workflow_dispatch:        # disparo manual pelo botão "Run workflow"

permissions:
  contents: write           # necessário para publicar/atualizar a Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar um Python para RODAR o build (só na nuvem)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o pacote portátil (Windows x64) + validar
        run: python empacotar.py --alvo windows-x64

      - name: Guardar/atualizar a Release PERMANENTE "pacote-windows"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Asset com nome ESTÁVEL (link sempre igual), a partir do zip completo do build.
          ZIP_BUILD="$(ls dist/PIRAXIS-*-windows-x64.zip | head -n1)"
          cp "$ZIP_BUILD" "dist/PIRAXIS-windows-x64.zip"

          SHA_SHORT="${GITHUB_SHA::7}"
          printf '%s\n\n%s\n\n%s\n' \
            "Pacote portátil do PIRAXIS para Windows — Python embutido, NÃO precisa instalar nada." \
            "Build automático do commit ${SHA_SHORT}." \
            "Como usar: baixe PIRAXIS-windows-x64.zip, extraia em um caminho CURTO (exemplo: C:\\PIRAXIS) e dê dois cliques em INICIAR PIRAXIS.bat." \
            > dist/release-notes.md

          # Release ROLANTE: apaga a anterior (+ tag) e recria apontando para o commit atual.
          gh release delete pacote-windows --yes --cleanup-tag 2>/dev/null || true
          gh release create pacote-windows "dist/PIRAXIS-windows-x64.zip" \
            --title "PIRAXIS — pacote Windows (mais recente)" \
            --notes-file dist/release-notes.md \
            --latest \
            --target "$GITHUB_SHA"

      - name: Anexar o pacote COMPLETO também como artefato (cópia da build)
        uses: actions/upload-artifact@v4
        with:
          name: PIRAXIS-windows-x64
          # Sobe a PASTA do pacote (não o .zip interno) -> download em camada única.
          path: dist/PIRAXIS
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
