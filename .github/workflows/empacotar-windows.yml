name: Empacotar PIRAXIS 1.1 (Windows separado)

# Este workflow só existe na branch 1.1. Nunca atualiza pacote-windows.
on:
  push:
    branches: ["piraxis-1.1-interface"]
  workflow_dispatch:

concurrency:
  group: piraxis-release-1.1
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build-windows:
    if: github.ref == 'refs/heads/piraxis-1.1-interface'
    runs-on: windows-latest
    steps:
      - name: Baixar a versão separada
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de validação
        run: |
          pip install -r Programa/requirements.lock -r Programa/requirements-dev.txt playwright
          python -m playwright install chromium

      - name: Rodar testes e verificar interface no Chromium
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Push-Location Programa
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/validar_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/validar_idioma_navegador.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Gerar e validar o pacote Windows 1.1
        run: python empacotar.py --alvo windows-x64 --locked --versao 1.1

      - name: Criar uma release nova sem substituir a anterior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP_BUILD="$(ls dist/PIRAXIS-1.1-*-windows-x64.zip | head -n1)"
          cp "$ZIP_BUILD" dist/PIRAXIS-1.1-windows-x64.zip
          (cd dist && sha256sum PIRAXIS-1.1-windows-x64.zip > SHA256SUMS-1.1.txt)
          printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "PIRAXIS 1.1 — pacote Windows separado, Python embutido." \
            "Commit: ${GITHUB_SHA}. Rótulos originais protegidos contra tradução automática." \
            "Extraia em C:\\PIRAXIS-1.1 e abra INICIAR PIRAXIS.bat. Preserve a pasta da versão anterior." \
            "A release pacote-windows e a branch original não foram alteradas." \
            > dist/release-notes-1.1.md
          # create falha se v1.1 já existir: nenhum clobber, edit ou force-push.
          gh release create v1.1 \
            dist/PIRAXIS-1.1-windows-x64.zip dist/SHA256SUMS-1.1.txt \
            dist/interface-1.1.png \
            --title "PIRAXIS 1.1 — Windows" \
            --notes-file dist/release-notes-1.1.md \
            --target "$GITHUB_SHA" --latest=false
