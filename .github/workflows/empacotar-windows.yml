name: Empacotar PIRAXIS (Windows portátil)

# Gera o PACOTE PORTÁTIL de Windows (Python embutido) numa máquina Windows da
# própria GitHub e publica o .zip como ARTEFATO para download — assim ninguém
# precisa instalar Python para gerar nem para rodar o programa.
#
# Como usar (pelo navegador, sem terminal):
#   1. Abra a aba "Actions" do repositório no GitHub.
#   2. Escolha "Empacotar PIRAXIS (Windows portátil)" na lista à esquerda.
#   3. Clique em "Run workflow" (botão à direita) e confirme.
#   4. Quando terminar (uns minutos), abra a execução e baixe o artefato
#      "PIRAXIS-windows-x64" (um .zip). Descompacte em um caminho CURTO
#      (ex.: C:\PIRAXIS) e dê dois cliques em INICIAR PIRAXIS.bat — não
#      precisa de Python na máquina de destino.
#
# O artefato contém o PACOTE COMPLETO (Python embutido + bibliotecas + app)
# como UMA camada só — sem zip-dentro-de-zip. Assim o usuário descompacta
# UMA vez, o caminho fica mais curto e não esbarra no limite de 260
# caracteres do Windows (que fazia o descompactador pular arquivos).

on:
  workflow_dispatch:        # disparo manual pelo botão "Run workflow"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar um Python para RODAR o build (só na nuvem)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o pacote portátil (Windows x64) + validar
        run: python empacotar.py --alvo windows-x64

      - name: Publicar o pacote COMPLETO para download (camada única)
        uses: actions/upload-artifact@v4
        with:
          name: PIRAXIS-windows-x64
          # Sobe a PASTA do pacote (não o .zip interno) -> o download já é
          # o pacote completo, descompactado UMA vez só. Sem zip-de-zip.
          path: dist/PIRAXIS
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
